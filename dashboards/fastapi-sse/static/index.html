<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E1554">
<title>Server Temp</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<script src="/static/vendor/uPlot.iife.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; overflow-x: hidden; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.5rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .dot.on { background: var(--ok); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; }
  footer { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🌡️ Server Temp</h1>
    <span class="dot" id="dot"></span><span id="conn" class="muted">connecting…</span>
    <a href="/admin" style="margin-left:auto">⚙️ Admin ›</a>
  </header>

  <div class="muted" style="margin-top:12px"><span id="threshold-note"></span> · devices: tap to show or hide</div>
  <div class="panel" id="temp"></div>
  <footer class="muted"><span id="t-pushed">0</span> live readings since this page opened</footer>
</main>
<script type="module" src="/static/dashboard.js"></script>
</body>
</html>
