# Kubelet drop-in (k3s runs kubelet with --config-dir=/var/lib/rancher/k3s/agent/etc/kubelet.conf.d).
# Graceful node shutdown: on poweroff/reboot kubelet holds a systemd "delay" inhibitor and stops pods
# properly, so Postgres gets its stop signal + grace period instead of SIGKILL.
# These are config-file-only fields — as --kubelet-arg flags they crash-loop k3s (2026-10-05).
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
shutdownGracePeriod: 60s
shutdownGracePeriodCriticalPods: 10s
