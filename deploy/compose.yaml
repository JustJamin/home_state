name: home_state

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_state
      POSTGRES_USER: home_state
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # Docker-published ports bypass ufw. Keep it host-local; never 0.0.0.0.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_state -d home_state"]
      interval: 5s
      timeout: 3s
      retries: 10

  scanner:
    build: ../scanner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://home_state:${POSTGRES_PASSWORD}@db:5432/home_state
    volumes:
      # BLE goes through the host's bluetoothd over D-Bus; no privileges needed
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

volumes:
  pgdata:
