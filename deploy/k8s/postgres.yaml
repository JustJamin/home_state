# Needs the "postgres" Secret (key: password), plus the "grafana", "dashboards" and "provisioning" Secrets (key: db-password);
# both created by hand, see deploy/README.md.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: home_state
            - name: POSTGRES_USER
              value: home_state
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            # used once by initdb/002_grafana_role.sh on a fresh volume
            - name: GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana
                  key: db-password
            # used once by initdb/003_dashboards_role.sh on a fresh volume
            - name: DASHBOARDS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboards
                  key: db-password
            # used once by initdb/004_provisioning.sh on a fresh volume
            - name: PROVISIONING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: provisioning
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "home_state", "-d", "home_state"]
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  # local-path PVs are deleted with their PVC; the PVC itself survives
  # deleting the StatefulSet. Only `kubectl delete pvc` loses data.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
