# The FastAPI + SSE dashboard and Admin app (dashboards/fastapi-sse): Deployment + NodePort Service.
# Needs the "dashboards", "provisioning" and "webpush" Secrets; see deploy/README.md.
# NodePorts are tailnet-only (k3s binds them to 127.0.0.1 + lenovo's Tailscale IP).
# Image: deploy/push-dashboards.sh
---
apiVersion: v1
kind: Service
metadata:
  name: dash-fastapi-sse
spec:
  type: NodePort
  selector:
    app: dash-fastapi-sse
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30304
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-fastapi-sse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dash-fastapi-sse
  template:
    metadata:
      labels:
        app: dash-fastapi-sse
        role: dashboard
    spec:
      serviceAccountName: dash-fastapi-sse  # read-only pods + node, for the health checks (health-rbac.yaml)
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: app
          image: localhost:5000/home_state-dash-fastapi-sse:latest
          imagePullPolicy: Always
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboards
                  key: db-password
            - name: DATABASE_URL
              value: postgresql://dashboards:$(DB_PASSWORD)@db:5432/home_state
            # provisioning store (configs, profiles, fleet): its own role, SELECT/INSERT only
            - name: PROVISIONING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: provisioning
                  key: db-password
            - name: PROVISIONING_DATABASE_URL
              value: postgresql://provisioning:$(PROVISIONING_DB_PASSWORD)@db:5432/home_state
            # Web Push (temperature alerts): VAPID keys, generated once (deploy/README.md)
            - name: VAPID_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: webpush, key: private-key}}
            - name: VAPID_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: webpush, key: public-key}}
            - name: VAPID_SUBJECT
              valueFrom: {secretKeyRef: {name: webpush, key: subject}}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
