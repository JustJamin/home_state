# Demo dashboards (dashboards/*), one Deployment + NodePort Service each.
# Needs the "dashboards" Secret (key: db-password); see deploy/README.md.
# NodePorts are tailnet-only (k3s binds them to 127.0.0.1 + lenovo's Tailscale IP).
# Images: deploy/push-dashboards.sh
---
apiVersion: v1
kind: Service
metadata:
  name: dash-streamlit
spec:
  type: NodePort
  selector:
    app: dash-streamlit
  ports:
    - name: http
      port: 8501
      targetPort: http
      nodePort: 30301
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dash-streamlit
  template:
    metadata:
      labels:
        app: dash-streamlit
        role: dashboard
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: app
          image: localhost:5000/home_state-dash-streamlit:latest
          imagePullPolicy: Always
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboards
                  key: db-password
            - name: DATABASE_URL
              value: postgresql://dashboards:$(DB_PASSWORD)@db:5432/home_state
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
