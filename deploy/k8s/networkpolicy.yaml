# Postgres only accepts connections from the scanner and the dashboard; nothing may connect to the scanner.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-clients
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: scanner
        - podSelector:
            matchLabels:
              role: dashboard
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scanner-no-ingress
spec:
  podSelector:
    matchLabels:
      app: scanner
  policyTypes: ["Ingress"]
